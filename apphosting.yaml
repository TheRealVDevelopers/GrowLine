# Firebase App Hosting configuration.
#
# Deliberately minimal: nine rollouts in a row failed at the preparer step with
# fah/invalid-apphosting-yaml while this file carried a scripts: block, flow-style
# availability arrays, and long prose comments. This version uses only constructs
# that appear verbatim in the official reference. The full deployment story -
# what each variable turns on, why there are no secrets, what stays off at launch -
# lives in docs/app-hosting.md.
#
# prisma generate now runs inside package.json's "build" script, so no custom
# buildCommand is needed here.

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: grow--line
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: grow--line.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBRwCRoOFfwWV4RgEJR5qbxCR0FL4_wwzs
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:131471483029:web:34a42285f95fb8da567b9c"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://growline--grow--line.asia-east1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_PROVIDER
    value: enterprise
    availability:
      - BUILD
      - RUNTIME

  - variable: DATABASE_URL
    value: "file:./dev.db"
    availability:
      - BUILD

  # RUNTIME only, never BUILD. A secret given BUILD availability is a secret in the
  # build logs, and the build has no use for it: nothing renders at build time.
  #
  # The same Secret Manager secret the nine Cloud Functions declare, deliberately —
  # seven of them work by calling this app's own HTTP routes, and checkCronSecret
  # compares what arrives against this value. Two secrets would be two things to
  # rotate and one silent 401.
  #
  # This entry is a HARD reference: if the App Hosting backend's service account
  # cannot read the secret, the whole rollout fails. Creating it with
  # `functions:secrets:set` grants the FUNCTIONS runtime account, not this one, so
  # the grant is a separate step and it must already have happened:
  #
  #     firebase apphosting:secrets:grantaccess CRON_SECRET -b growline
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
